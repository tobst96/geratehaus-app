services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geratehaus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-please}
      POSTGRES_DB: ${POSTGRES_DB:-geratehaus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geratehaus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
      # Backup-Zielordner. Für Sicherung außerhalb des Containers hier stattdessen
      # einen Host-Bind-Mount eintragen, z. B.: - /pfad/auf/host/backups:/app/backups
      - backups:/app/backups
      # Geteilter Ordner fürs Update-Signal: Die Update-Seite schreibt hier eine
      # Markerdatei; das Host-Skript scripts/updater.sh beobachtet denselben Ordner
      # auf dem Host und führt git pull + docker compose up -d --build aus.
      - ./update-signal:/app/update-signal
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-9112}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  uploads:
  backups:
