services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geratehaus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-please}
      POSTGRES_DB: ${POSTGRES_DB:-geratehaus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geratehaus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
      # Backup-Zielordner. Für Sicherung außerhalb des Containers hier stattdessen
      # einen Host-Bind-Mount eintragen, z. B.: - /pfad/auf/host/backups:/app/backups
      - backups:/app/backups
      # Geteilter Ordner fürs Update-Signal: Die Update-Seite schreibt hier eine
      # Markerdatei; das Host-Skript scripts/updater.sh beobachtet denselben Ordner
      # auf dem Host und führt git pull + docker compose up -d --build aus.
      - ./update-signal:/app/update-signal
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-9112}:80"
    depends_on:
      backend:
        condition: service_healthy

  # Optionaler, lokal mitgelieferter S3-Speicher (MinIO). Startet NUR mit
  # `docker compose --profile minio up -d`. Danach im Modul „Backup" als
  # S3-Ziel eintragen: Endpoint http://minio:9000, Access/Secret = die
  # MINIO_ROOT_*-Werte, Bucket vorher in der Konsole (Port 9101) anlegen.
  # WICHTIG: MinIO auf DEMSELBEN Host ist KEIN Off-Site-Backup – zusätzlich
  # ein externes Ziel (WebDAV/SFTP/externes S3) nutzen.
  minio:
    image: minio/minio:latest
    profiles: ["minio"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-geratehaus}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-bitte-aendern}"
    ports:
      - "${MINIO_API_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  uploads:
  backups:
  minio_data:
