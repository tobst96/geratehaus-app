name: CI

# Führt bei jedem Pull Request und bei Pushes auf beta/main die Prüfungen aus,
# die laut CLAUDE.md vor jedem Deploy grün sein müssen: Backend-Tests (pytest gegen
# eine echte PostgreSQL) und der Frontend-Build (tsc + vite).

on:
  pull_request:
  push:
    branches: [beta, main]

# Laufende Runs eines Branches abbrechen, wenn neu gepusht wird (spart Minuten).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: geratehaus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # WeasyPrint (PDF-Erzeugung) braucht Pango & Co. zur Importzeit.
      - name: WeasyPrint-Systembibliotheken
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Backend installieren (inkl. Dev-Extras)
        working-directory: backend
        run: pip install ".[dev]"

      - name: pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/geratehaus_test
        run: python -m pytest

  frontend-build:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: Tests (vitest)
        working-directory: frontend
        run: npm run test
      - name: Build (tsc + vite)
        working-directory: frontend
        run: npm run build
