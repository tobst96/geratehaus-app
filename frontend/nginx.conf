server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend erlaubt Personen-Bilder bis 5 MB – Standardlimit von nginx (1 MB) anheben.
    client_max_body_size 10m;

    # Content-Security-Policy **scharf** (enforcing) – blockiert alles, was nicht
    # explizit erlaubt ist. Voraus ging eine Report-Only-Phase + Ressourcen-Analyse:
    # die App lädt keine externen Runtime-Ressourcen (Schriften selbst gehostet, Logo
    # = same-origin-Upload, iCal/WebDAV serverseitig, kein CDN/iframe/Fremdskript).
    # Erlaubt: eigene gehashte Assets ('self'), React-Inline-Styles ('unsafe-inline'
    # im style-src), Bilder als self/data/blob (QR-/Barcodes, Uploads, Kamera-Preview),
    # Service-Worker/Manifest ('self'). `connect-src` deckt neben 'self' (API gleiche
    # Origin) die **Sentry-Ingest-Domains** ab – nötig, wenn Fehlerberichte/Session-
    # Replay aktiv sind. Wer ein **selbst gehostetes** Sentry nutzt, ergänzt dessen
    # Domain hier; wer ein **externes** Logo per URL setzt, ergänzt dessen Host in
    # `img-src`. `report-uri` bleibt aktiv → Verstöße werden weiter geloggt
    # (/api/v1/csp-report → Logs/Sentry). **Zurücknehmen** (z. B. falls ein Kiosk-Flow
    # bricht): die beiden `Content-Security-Policy`-Header unten wieder auf
    # `Content-Security-Policy-Report-Only` stellen und neu bauen.
    set $csp "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://*.ingest.sentry.io https://*.ingest.de.sentry.io https://*.ingest.us.sentry.io; manifest-src 'self'; worker-src 'self'; report-uri /api/v1/csp-report";

    # API und Datei-Uploads gehen an das Backend.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
    }

    # Service Worker nie cachen, damit Updates sofort greifen.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # index.html nie cachen: Sie referenziert die gehashten Assets. Wird sie
    # gecacht, zeigt der Browser nach einem Deploy weiter auf das alte Bundle
    # (z. B. entfernte Punkte-Anzeige bleibt sichtbar).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Content-Security-Policy $csp always;
        try_files $uri =404;
    }

    # Gehashte Assets sind unveränderlich (Dateiname ändert sich bei jedem Build)
    # und dürfen dauerhaft gecacht werden.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA-Fallback: alle unbekannten Pfade an index.html (React Router übernimmt).
    location / {
        add_header Content-Security-Policy $csp always;
        try_files $uri $uri/ /index.html;
    }
}
