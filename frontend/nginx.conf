server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend erlaubt Personen-Bilder bis 5 MB – Standardlimit von nginx (1 MB) anheben.
    client_max_body_size 10m;

    # API und Datei-Uploads gehen an das Backend.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
    }

    # Service Worker nie cachen, damit Updates sofort greifen.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # index.html nie cachen: Sie referenziert die gehashten Assets. Wird sie
    # gecacht, zeigt der Browser nach einem Deploy weiter auf das alte Bundle
    # (z. B. entfernte Punkte-Anzeige bleibt sichtbar).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Gehashte Assets sind unveränderlich (Dateiname ändert sich bei jedem Build)
    # und dürfen dauerhaft gecacht werden.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA-Fallback: alle unbekannten Pfade an index.html (React Router übernimmt).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
